<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Central de Iluminação IoT</title>
<!-- Paho MQTT via CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
:root {
  --bg: #0a0e17;
  --panel: #111827;
  --panel-2: #0d1320;
  --border: #1f2a3d;
  --text: #e6edf7;
  --muted: #7d8ba3;
  --accent: #ffb938;
  --accent-glow: rgba(255, 185, 56, 0.55);
  --ok: #34d399;
  --err: #f87171;
  --warn: #fbbf24;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background:
    radial-gradient(800px 500px at 50% -10%, #1b2a4a55, transparent 70%),
    var(--bg);
}

.glass-card {
  width: 100%;
  max-width: 460px;
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 1.6rem 1.6rem 1.4rem;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

/* Cabeçalho */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.8rem;
  margin-bottom: 1.4rem;
}
.title-group { display: flex; flex-direction: column; gap: 0.2rem; }
.title-main { font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }
.title-sub { font-size: 0.78rem; color: var(--muted); }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.8rem;
  border-radius: 999px;
  background: #0b1120;
  border: 1px solid var(--border);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--warn);
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.status-dot.online  { background: var(--ok);  box-shadow: 0 0 10px var(--ok); }
.status-dot.offline { background: var(--err); box-shadow: 0 0 10px var(--err); }
.status-dot.sync    { background: var(--warn); animation: pulse-dot 1.2s ease-in-out infinite; }
@keyframes pulse-dot {
  0%, 100% { opacity: 0.5; transform: scale(0.9); }
  50%      { opacity: 1;   transform: scale(1.25); }
}

/* Tópico */
.topic-area { margin-bottom: 1.6rem; }
.topic-label {
  display: block;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.45rem;
}
.topic-input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  background: #0b1120;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.topic-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255, 185, 56, 0.15);
}

/* Indicador do dispositivo */
.led-preview {
  display: flex;
  justify-content: center;
  padding: 1.2rem 0 1.6rem;
}
.led-circle {
  position: relative;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 1.2rem;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: background 0.4s ease, box-shadow 0.5s ease, color 0.3s;
}
.led-circle::before {
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 1px dashed var(--border);
  transition: border-color 0.4s;
}
.led-circle.inactive {
  background: radial-gradient(circle at 35% 30%, #1d2a42, #0e1524 70%);
  color: var(--muted);
  box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border);
}
.led-circle.active {
  background: radial-gradient(circle at 35% 30%, #fff1c9, var(--accent) 55%, #e58a00);
  color: #3b2400;
  box-shadow: 0 0 40px var(--accent-glow), 0 0 90px rgba(255, 185, 56, 0.25);
  animation: glow-pulse 2.4s ease-in-out infinite;
}
.led-circle.active::before { border-color: rgba(255, 185, 56, 0.5); }
@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 34px var(--accent-glow), 0 0 80px rgba(255, 185, 56, 0.2); }
  50%      { box-shadow: 0 0 52px var(--accent-glow), 0 0 110px rgba(255, 185, 56, 0.35); }
}

/* Botões */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
.btn {
  padding: 0.95rem 0.6rem;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #151d2e;
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  cursor: not-allowed;
  opacity: 0.45;
  transition: transform 0.12s, background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
}
.btn.enabled { cursor: pointer; opacity: 1; }
.btn.enabled:active { transform: scale(0.96); }

.btn-on.enabled {
  background: rgba(52, 211, 153, 0.12);
  border-color: rgba(52, 211, 153, 0.5);
  color: var(--ok);
}
.btn-on.enabled:hover { background: rgba(52, 211, 153, 0.22); box-shadow: 0 0 20px rgba(52, 211, 153, 0.2); }

.btn-off.enabled {
  background: rgba(248, 113, 113, 0.1);
  border-color: rgba(248, 113, 113, 0.45);
  color: var(--err);
}
.btn-off.enabled:hover { background: rgba(248, 113, 113, 0.2); box-shadow: 0 0 20px rgba(248, 113, 113, 0.18); }

.footer {
  margin-top: 1.3rem;
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  opacity: 0.7;
}

@media (max-width: 420px) {
  .glass-card { padding: 1.3rem 1.1rem; border-radius: 22px; }
  .header { flex-direction: column; }
  .led-circle { width: 120px; height: 120px; font-size: 0.72rem; }
}
</style>
</head>
<body>

<div class="glass-card">
  <div class="header">
    <div class="title-group">
      <span class="title-main">💡 Central de Iluminação</span>
      <span class="title-sub">Controle de Hardware · Porta 13</span>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot sync" id="statusDot"></span>
      <span class="status-text" id="statusText">Sincronizando...</span>
    </div>
  </div>

  <div class="topic-area">
    <label class="topic-label" for="topicInput">Tópico MQTT</label>
    <input class="topic-input" id="topicInput" type="text" value="gerry_sanchez_led_exclusivo/arduino" spellcheck="false">
  </div>

  <div class="led-preview">
    <div class="led-circle inactive" id="ledCircle">Dispositivo Inativo</div>
  </div>

  <div class="actions">
    <button class="btn btn-on" id="btnOn" disabled>⚡ LIGAR</button>
    <button class="btn btn-off" id="btnOff" disabled>⏻ DESLIGAR</button>
  </div>

  <div class="footer">atualização via MQTT · broker.hivemq.com</div>
</div>

<script>
(function() {
  // --- DOM Refs ---
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const ledCircle = document.getElementById('ledCircle');
  const btnOn = document.getElementById('btnOn');
  const btnOff = document.getElementById('btnOff');
  const topicInput = document.getElementById('topicInput');

  // --- Estado interno ---
  let currentTopic = topicInput.value.trim();
  let client = null;
  let isConnected = false;
  let ledState = 0; // 0 = off, 1 = on

  // --- Helpers UI ---
  function setStatus(mode, msg) {
    statusDot.className = 'status-dot';
    if (mode === 'sync') {
      statusDot.classList.add('sync');
      statusText.textContent = msg || 'Sincronizando...';
    } else if (mode === 'online') {
      statusDot.classList.add('online');
      statusText.textContent = msg || 'Sistema Online';
    } else if (mode === 'offline') {
      statusDot.classList.add('offline');
      statusText.textContent = msg || 'Desconectado';
    }
  }

  function setButtonsEnabled(enabled) {
    if (enabled) {
      btnOn.disabled = false;
      btnOff.disabled = false;
      btnOn.classList.add('enabled');
      btnOff.classList.add('enabled');
    } else {
      btnOn.disabled = true;
      btnOff.disabled = true;
      btnOn.classList.remove('enabled');
      btnOff.classList.remove('enabled');
    }
  }

  function updateLedUI(state) {
    if (state === 1) {
      ledCircle.className = 'led-circle active';
      ledCircle.textContent = 'Dispositivo Ativo';
    } else {
      ledCircle.className = 'led-circle inactive';
      ledCircle.textContent = 'Dispositivo Inativo';
    }
  }

  // --- Lógica MQTT ---
  function connectMqtt() {
    if (client) {
      try { client.disconnect(); } catch (_) {}
      client = null;
    }

    const clientId = 'web_' + Math.random().toString(16).substring(2, 10) + '_' + Date.now().toString(36);
    const broker = 'broker.hivemq.com';
    const port = 8884;

    client = new Paho.MQTT.Client(broker, port, clientId);

    const onConnect = () => {
      isConnected = true;
      setStatus('online', 'Sistema Online');
      setButtonsEnabled(true);

      const topic = currentTopic;
      if (topic && topic.length > 0) {
        client.subscribe(topic, { qos: 0 });
        console.log('[MQTT] inscrito em:', topic);
      }
    };

    const onFailure = (err) => {
      isConnected = false;
      setStatus('offline', 'Falha na conexão');
      setButtonsEnabled(false);
      console.warn('[MQTT] erro conexão:', err);
      setTimeout(() => {
        if (!isConnected) connectMqtt();
      }, 5000);
    };

    const onMessageArrived = (message) => {
      const payload = message.payloadString.trim();
      const topic = message.destinationName;
      console.log(`[MQTT] mensagem em ${topic}:`, payload);

      if (topic === currentTopic) {
        if (payload === '1') {
          ledState = 1;
          updateLedUI(1);
        } else if (payload === '0') {
          ledState = 0;
          updateLedUI(0);
        }
      }
    };

    client.onConnectionLost = (response) => {
      isConnected = false;
      setStatus('offline', 'Conexão perdida');
      setButtonsEnabled(false);
      console.warn('[MQTT] conexão perdida', response);
      setTimeout(() => {
        if (!isConnected) connectMqtt();
      }, 4000);
    };

    client.onMessageArrived = onMessageArrived;

    const options = {
      timeout: 10,
      onSuccess: onConnect,
      onFailure: onFailure,
      useSSL: true,
    };

    client.connect(options);
  }

  // --- Troca de Tópico ---
  function switchTopic(newTopic) {
    if (!client || !isConnected) return;
    if (!newTopic || newTopic.length === 0) return;

    const oldTopic = currentTopic;
    if (oldTopic && oldTopic.length > 0 && oldTopic !== newTopic) {
      try {
        client.unsubscribe(oldTopic, { qos: 0 });
        console.log('[MQTT] desinscrito de:', oldTopic);
      } catch (e) {
        console.warn('[MQTT] erro ao desinscrever', e);
      }
    }

    try {
      client.subscribe(newTopic, { qos: 0 });
      console.log('[MQTT] inscrito em:', newTopic);
      currentTopic = newTopic;
    } catch (e) {
      console.warn('[MQTT] erro ao inscrever', e);
    }
  }

  // --- Publicação de Comandos ---
  function publishCommand(value) {
    if (!client || !isConnected) {
      console.warn('[MQTT] não conectado');
      return;
    }
    const topic = currentTopic;
    if (!topic || topic.length === 0) {
      console.warn('[MQTT] tópico inválido');
      return;
    }
    const msg = new Paho.MQTT.Message(String(value));
    msg.destinationName = topic;
    msg.qos = 0;
    client.send(msg);
    console.log(`[MQTT] publicado '${value}' em ${topic}`);
  }

  // --- Eventos da Interface ---
  function handleTopicChange() {
    const newTopic = topicInput.value.trim();
    if (newTopic === currentTopic || newTopic.length === 0) return;

    if (isConnected && client) {
      switchTopic(newTopic);
    } else {
      currentTopic = newTopic;
    }
  }

  function init() {
    setStatus('sync', 'Sincronizando...');
    setButtonsEnabled(false);
    updateLedUI(0);
    ledState = 0;

    connectMqtt();

    btnOn.addEventListener('click', function() {
      if (!isConnected) return;
      publishCommand('1');
    });

    btnOff.addEventListener('click', function() {
      if (!isConnected) return;
      publishCommand('0');
    });

    let topicTimeout = null;
    topicInput.addEventListener('input', function() {
      clearTimeout(topicTimeout);
      topicTimeout = setTimeout(() => {
        handleTopicChange();
      }, 400);
    });

    topicInput.addEventListener('blur', function() {
      clearTimeout(topicTimeout);
      handleTopicChange();
    });
  }

  init();

  window.__iot = { client, connectMqtt, publishCommand, currentTopic };
})();
</script>
</body>
</html>
