<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de LEDs</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #111827;
      --panel-2: #0d1320;
      --border: #1f2a3d;
      --text: #e6edf7;
      --muted: #7d8ba3;
      --ok: #34d399;
      --err: #f87171;
      --warn: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(800px 500px at 50% -10%, #1b2a4a55, transparent 70%), var(--bg);
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 1.6rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
      flex-wrap: wrap;
    }

    .title-main { font-size: 1.25rem; font-weight: 650; display: block; }
    .title-sub { font-size: 0.78rem; color: var(--muted); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: #0b1120;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.online { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .status-dot.offline { background: var(--err); box-shadow: 0 0 10px var(--err); }
    .status-dot.sync { animation: pulse-dot 1.2s ease-in-out infinite; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .topic-area { margin-bottom: 1.6rem; }

    .topic-label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .topic-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      outline: none;
    }

    .topic-input:focus { border-color: #5b8def; box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.18); }

    /* Três indicadores lado a lado */
    .leds {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .led-card {
      --c: #ffb938;
      --c-glow: rgba(255, 185, 56, 0.55);
      --c-light: #fff1c9;
      --c-dark: #e58a00;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.3rem 0.8rem 1rem;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .led-card[data-led="2"] {
      --c: #34d399; --c-glow: rgba(52, 211, 153, 0.55); --c-light: #d1fae5; --c-dark: #059669;
    }

    .led-card[data-led="3"] {
      --c: #f87171; --c-glow: rgba(248, 113, 113, 0.55); --c-light: #fee2e2; --c-dark: #dc2626;
    }

    .led-name { font-size: 0.95rem; font-weight: 600; }
    .led-pin { font-size: 0.75rem; color: var(--muted); margin-top: -0.7rem; }

    .led-bulb {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #1d2a42, #0e1524 70%);
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border);
      transition: background 0.35s, box-shadow 0.45s;
    }

    .led-card.on .led-bulb {
      background: radial-gradient(circle at 35% 30%, var(--c-light), var(--c) 55%, var(--c-dark));
      box-shadow: 0 0 34px var(--c-glow), 0 0 70px var(--c-glow);
    }

    .led-state { font-size: 0.8rem; color: var(--muted); min-height: 1.1em; }
    .led-card.on .led-state { color: var(--c); }

    .btns { display: flex; gap: 0.5rem; width: 100%; }

    .btn {
      flex: 1;
      padding: 0.65rem 0.3rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #151d2e;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: not-allowed;
      opacity: 0.45;
      transition: transform 0.12s, background 0.2s, opacity 0.2s;
    }

    .btn:not(:disabled) { cursor: pointer; opacity: 1; }
    .btn:not(:disabled):active { transform: scale(0.96); }
    .btn:focus-visible { outline: 2px solid #5b8def; outline-offset: 2px; }

    .btn-on:not(:disabled) { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.5); color: var(--ok); }
    .btn-on:not(:disabled):hover { background: rgba(52, 211, 153, 0.22); }
    .btn-off:not(:disabled) { background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.45); color: var(--err); }
    .btn-off:not(:disabled):hover { background: rgba(248, 113, 113, 0.2); }

    .btn-all {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      border-radius: 14px;
      border: 1px solid rgba(91, 141, 239, 0.5);
      background: rgba(91, 141, 239, 0.12);
      color: #8fb1f5;
      font-size: 0.9rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s, opacity 0.2s;
    }

    .btn-all:hover:not(:disabled) { background: rgba(91, 141, 239, 0.22); }
    .btn-all:active:not(:disabled) { transform: scale(0.98); }
    .btn-all:disabled { cursor: not-allowed; opacity: 0.45; }
    .btn-all:focus-visible { outline: 2px solid #5b8def; outline-offset: 2px; }

    .footer { margin-top: 1.3rem; text-align: center; font-size: 0.72rem; color: var(--muted); }

    @media (max-width: 560px) {
      .leds { grid-template-columns: 1fr; }
      .led-card { flex-direction: row; flex-wrap: wrap; justify-content: space-between; }
      .led-bulb { width: 64px; height: 64px; }
      .btns { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="header">
      <div>
        <span class="title-main">Central de LEDs</span>
        <span class="title-sub">Arduino · pinos 8, 9 e 10</span>
      </div>
      <div class="status-pill">
        <span class="status-dot sync" id="statusDot"></span>
        <span id="statusText">Conectando...</span>
      </div>
    </div>

    <div class="topic-area">
      <label class="topic-label" for="topicInput">Tópico MQTT</label>
      <input class="topic-input" id="topicInput" type="text" value="raw.data" spellcheck="false">
    </div>

    <div class="leds">
      <div class="led-card" data-led="1">
        <span class="led-name">LED 1</span>
        <span class="led-pin">pino 8</span>
        <div class="led-bulb"></div>
        <span class="led-state">Desligado</span>
        <div class="btns">
          <button class="btn btn-on" data-cmd="LIGA_LED_1" disabled>Ligar</button>
          <button class="btn btn-off" data-cmd="DESLIGA_LED_1" disabled>Desligar</button>
        </div>
      </div>

      <div class="led-card" data-led="2">
        <span class="led-name">LED 2</span>
        <span class="led-pin">pino 9</span>
        <div class="led-bulb"></div>
        <span class="led-state">Desligado</span>
        <div class="btns">
          <button class="btn btn-on" data-cmd="LIGA_LED_2" disabled>Ligar</button>
          <button class="btn btn-off" data-cmd="DESLIGA_LED_2" disabled>Desligar</button>
        </div>
      </div>

      <div class="led-card" data-led="3">
        <span class="led-name">LED 3</span>
        <span class="led-pin">pino 10</span>
        <div class="led-bulb"></div>
        <span class="led-state">Desligado</span>
        <div class="btns">
          <button class="btn btn-on" data-cmd="LIGA_LED_3" disabled>Ligar</button>
          <button class="btn btn-off" data-cmd="DESLIGA_LED_3" disabled>Desligar</button>
        </div>
      </div>
    </div>

    <button class="btn-all" id="toggleAll" disabled>Ligar todos</button>

    <div class="footer">Mostra o último comando enviado · broker.hivemq.com</div>
  </main>

  <script>
    (function () {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const topicInput = document.getElementById('topicInput');
      const buttons = document.querySelectorAll('.btn');
      const cards = {
        1: document.querySelector('.led-card[data-led="1"]'),
        2: document.querySelector('.led-card[data-led="2"]'),
        3: document.querySelector('.led-card[data-led="3"]'),
      };

      let currentTopic = topicInput.value.trim();
      let client = null;
      let isConnected = false;

      function setStatus(mode, msg) {
        statusDot.className = 'status-dot ' + mode;
        statusText.textContent = msg;
      }

      const toggleAll = document.getElementById('toggleAll');

      function setButtonsEnabled(enabled) {
        buttons.forEach(b => { b.disabled = !enabled; });
        toggleAll.disabled = !enabled;
      }

      function allOn() {
        return [1, 2, 3].every(n => cards[n].classList.contains('on'));
      }

      function updateToggleAll() {
        toggleAll.textContent = allOn() ? 'Desligar todos' : 'Ligar todos';
      }

      function setLed(n, on) {
        const card = cards[n];
        if (!card) return;
        card.classList.toggle('on', on);
        card.querySelector('.led-state').textContent = on ? 'Ligado' : 'Desligado';
        updateToggleAll();
      }

      function connectMqtt() {
        if (client) {
          try { client.disconnect(); } catch (_) { }
        }

        const clientId = 'web_' + Math.random().toString(16).slice(2, 10) + '_' + Date.now().toString(36);
        client = new Paho.MQTT.Client('broker.hivemq.com', 8884, clientId);

        client.onConnectionLost = () => {
          isConnected = false;
          setStatus('offline', 'Conexão perdida');
          setButtonsEnabled(false);
          setTimeout(() => { if (!isConnected) connectMqtt(); }, 4000);
        };

        client.onMessageArrived = (message) => {
          if (message.destinationName !== currentTopic) return;
          const m = message.payloadString.trim().match(/^(LIGA|DESLIGA)_LED_([1-3])$/);
          if (m) setLed(m[2], m[1] === 'LIGA');
        };

        client.connect({
          timeout: 10,
          useSSL: true,
          onSuccess: () => {
            isConnected = true;
            setStatus('online', 'Online');
            setButtonsEnabled(true);
            if (currentTopic) client.subscribe(currentTopic, { qos: 0 });
          },
          onFailure: () => {
            isConnected = false;
            setStatus('offline', 'Falha na conexão');
            setButtonsEnabled(false);
            setTimeout(() => { if (!isConnected) connectMqtt(); }, 5000);
          },
        });
      }

      function publish(cmd) {
        if (!client || !isConnected || !currentTopic) return;
        const msg = new Paho.MQTT.Message(cmd);
        msg.destinationName = currentTopic;
        msg.qos = 0;
        client.send(msg);
      }

      function changeTopic(newTopic) {
        if (!newTopic || newTopic === currentTopic) return;
        if (isConnected) {
          try { client.unsubscribe(currentTopic); } catch (_) { }
          client.subscribe(newTopic, { qos: 0 });
        }
        currentTopic = newTopic;
      }

      buttons.forEach(b => b.addEventListener('click', () => publish(b.dataset.cmd)));

      toggleAll.addEventListener('click', () => {
        const prefix = allOn() ? 'DESLIGA' : 'LIGA';
        [1, 2, 3].forEach(n => publish(prefix + '_LED_' + n));
      });

      let t = null;
      topicInput.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => changeTopic(topicInput.value.trim()), 400);
      });
      topicInput.addEventListener('blur', () => {
        clearTimeout(t);
        changeTopic(topicInput.value.trim());
      });

      setButtonsEnabled(false);
      connectMqtt();
    })();
  </script>
</body>

</html>
